<div class="quiz__header">
  <h1>Quiz</h1>
  <app-button (click)="openCreateModal()">
    <lucide-icon name="plus" [size]="16"></lucide-icon>
    Add
  </app-button>
</div>

<ng-template #typeTpl let-value="value">
  <app-badge [variant]="value === 'survey' ? 'gray' : 'indigo'">{{ value || '-' }}</app-badge>
</ng-template>

<ng-template #periodTpl let-row="row">
  {{ formatPeriod($any(row)) }}
</ng-template>

<ng-template #statusTpl let-value="value">
  <app-badge [variant]="value === 'inactive' ? 'gray' : (value === 'closed' ? 'rose' : 'emerald')">
    {{ value || '-' }}
  </app-badge>
</ng-template>

<ng-template #aksiTpl let-row="row">
  <div class="quiz__actions">
    <app-icon-button
      *ngIf="canShareQuiz($any(row))"
      icon="share-2"
      label="Share"
      (click)="share($any(row))"
      [disabled]="sharingQuizId === $any(row).id"
    ></app-icon-button>
    <app-icon-button icon="pencil" label="Edit" (click)="openEditModal($any(row))"></app-icon-button>
    <app-icon-button
      *ngIf="$any(row).has_submissions"
      icon="copy"
      label="Duplicate"
      (click)="duplicate($any(row))"
      [disabled]="duplicatingQuizId === $any(row).id"
    ></app-icon-button>
    <app-icon-button variant="danger" icon="trash-2" label="Delete" (click)="remove($any(row))"></app-icon-button>
  </div>
</ng-template>

<app-data-table
  [rows]="quizzes"
  [columns]="columns"
  [serverSide]="true"
  [totalCount]="totalCount"
  [pageSize]="pageSize"
  (search)="onTableQueryChange($event)"
  (refresh)="loadQuizzes()"
  searchPlaceholder="Search title..."
  emptyMessage="Belum ada quiz. Klik &quot;Add&quot; untuk menambahkan."
></app-data-table>

<app-modal
  [open]="isModalOpen"
  [title]="editingId ? 'Edit Quiz' : 'Tambah Quiz'"
  (closed)="closeModal()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input label="Title" [required]="true" formControlName="title" [errorMessage]="fieldError('title')"></app-input>

    <app-select label="Type" [required]="true" [options]="typeOptions" formControlName="type"></app-select>

    <div class="quiz__date-row">
      <app-datetime-picker
        *ngIf="isQuizType"
        label="Jam Mulai"
        mode="time"
        [required]="true"
        formControlName="start_input"
        [errorMessage]="fieldError('start_input')"
      ></app-datetime-picker>
      <app-datetime-picker
        *ngIf="!isQuizType"
        label="Mulai"
        mode="datetime"
        [required]="true"
        formControlName="start_input"
        [errorMessage]="fieldError('start_input')"
      ></app-datetime-picker>

      <app-datetime-picker
        *ngIf="isQuizType"
        label="Jam Selesai"
        mode="time"
        [required]="true"
        formControlName="end_input"
        [errorMessage]="fieldError('end_input')"
      ></app-datetime-picker>
      <app-datetime-picker
        *ngIf="!isQuizType"
        label="Selesai"
        mode="datetime"
        [required]="true"
        formControlName="end_input"
        [errorMessage]="fieldError('end_input')"
      ></app-datetime-picker>
    </div>

    <app-input
      *ngIf="isQuizType"
      label="Max Point"
      [required]="true"
      type="number"
      formControlName="max_point"
      [errorMessage]="fieldError('max_point')"
    ></app-input>

    <app-input
      *ngIf="isQuizType"
      label="Passing Grade"
      [required]="true"
      type="number"
      formControlName="passing_grade"
      [errorMessage]="fieldError('passing_grade')"
    ></app-input>

    <app-input
      label="Jumlah Soal Random (opsional, kosongkan buat tampilkan semua soal)"
      type="number"
      formControlName="random_question_count"
      [errorMessage]="fieldError('random_question_count')"
    ></app-input>

    <div class="quiz__field quiz__field--checkbox" *ngIf="isQuizType">
      <label class="quiz__checkbox-label">
        <input type="checkbox" formControlName="lock_mode" />
        Lock Mode (Anti-Cheat)
      </label>
      <p class="quiz__field-hint">
        Kalau aktif, responden wajib fullscreen selama quiz. Keluar tab atau keluar fullscreen dihitung
        pelanggaran, kalau sudah 3x quiz otomatis di-submit.
      </p>
    </div>

    <app-input
      label="Description"
      formControlName="description"
      [multiline]="true"
    ></app-input>

    <app-select label="Status" [required]="true" [options]="statusOptions" formControlName="status"></app-select>

    <div class="quiz__form-actions">
      <app-button variant="ghost" type="button" (click)="closeModal()">Cancel</app-button>
      <app-button type="submit" [disabled]="isSaving">
        <lucide-icon name="save" [size]="16"></lucide-icon>
        {{ isSaving ? 'Saving...' : 'Save' }}
      </app-button>
    </div>
  </form>
</app-modal>
