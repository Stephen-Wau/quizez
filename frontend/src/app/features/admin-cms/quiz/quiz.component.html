<div class="quiz__header">
  <h1>Quiz</h1>
  <app-button (click)="openCreateModal()">
    <lucide-icon name="plus" [size]="16"></lucide-icon>
    Add
  </app-button>
</div>

<ng-template #typeTpl let-value="value">
  <span class="quiz__badge" [class.quiz__badge--survey]="value === 'survey'">{{ value || '-' }}</span>
</ng-template>

<ng-template #periodTpl let-row="row">
  {{ formatPeriod($any(row)) }}
</ng-template>

<ng-template #aksiTpl let-row="row">
  <div class="quiz__actions">
    <app-button variant="ghost" size="sm" (click)="openEditModal($any(row))">
      <lucide-icon name="pencil" [size]="14"></lucide-icon>
      Edit
    </app-button>
    <app-button variant="danger" size="sm" (click)="remove($any(row))">
      <lucide-icon name="trash-2" [size]="14"></lucide-icon>
      Delete
    </app-button>
  </div>
</ng-template>

<app-data-table
  [rows]="quizzes"
  [columns]="columns"
  [serverSide]="true"
  [totalCount]="totalCount"
  [pageSize]="pageSize"
  (search)="onTableQueryChange($event)"
  (refresh)="loadQuizzes()"
  searchPlaceholder="Search title..."
  emptyMessage="Belum ada quiz. Klik &quot;Add&quot; untuk menambahkan."
></app-data-table>

<app-modal
  [open]="isModalOpen"
  [title]="editingId ? 'Edit Quiz' : 'Tambah Quiz'"
  (closed)="closeModal()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input label="Title" [required]="true" formControlName="title" [errorMessage]="fieldError('title')"></app-input>

    <div class="quiz__field">
      <label>Type<span class="quiz__required">*</span></label>
      <select class="quiz__select" formControlName="type">
        <option value="quiz">Quiz</option>
        <option value="survey">Survey</option>
      </select>
    </div>

    <div class="quiz__date-row">
      <app-input
        *ngIf="isQuizType"
        label="Jam Mulai"
        [required]="true"
        type="time"
        formControlName="start_input"
        [errorMessage]="fieldError('start_input')"
      ></app-input>
      <app-input
        *ngIf="!isQuizType"
        label="Mulai"
        [required]="true"
        type="datetime-local"
        formControlName="start_input"
        [errorMessage]="fieldError('start_input')"
      ></app-input>

      <app-input
        *ngIf="isQuizType"
        label="Jam Selesai"
        [required]="true"
        type="time"
        formControlName="end_input"
        [errorMessage]="fieldError('end_input')"
      ></app-input>
      <app-input
        *ngIf="!isQuizType"
        label="Selesai"
        [required]="true"
        type="datetime-local"
        formControlName="end_input"
        [errorMessage]="fieldError('end_input')"
      ></app-input>
    </div>

    <app-input
      *ngIf="isQuizType"
      label="Max Point"
      [required]="true"
      type="number"
      formControlName="max_point"
      [errorMessage]="fieldError('max_point')"
    ></app-input>

    <app-input
      label="Description"
      formControlName="description"
      [multiline]="true"
    ></app-input>

    <div class="quiz__field">
      <label>Status<span class="quiz__required">*</span></label>
      <select class="quiz__select" formControlName="status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="quiz__form-actions">
      <app-button variant="ghost" type="button" (click)="closeModal()">Cancel</app-button>
      <app-button type="submit" [disabled]="isSaving">
        <lucide-icon name="save" [size]="16"></lucide-icon>
        {{ isSaving ? 'Saving...' : 'Save' }}
      </app-button>
    </div>
  </form>
</app-modal>
