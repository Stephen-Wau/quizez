<div class="toast-container">
  <div
    *ngFor="let toast of toastService.toasts()"
    class="toast"
    [class]="'toast--' + toast.type"
    [style.--toast-duration.ms]="dismissMs"
  >
    <span class="toast__icon" [ngSwitch]="toast.type">
      <svg *ngSwitchCase="'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path d="M8 12.5l2.5 2.5L16 9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <svg *ngSwitchCase="'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path d="M9 9l6 6M15 9l-6 6" stroke-linecap="round" />
      </svg>
      <svg *ngSwitchCase="'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3l10 18H2L12 3z" stroke-linejoin="round" />
        <path d="M12 10v4" stroke-linecap="round" />
        <circle cx="12" cy="17.5" r="0.75" fill="currentColor" stroke="none" />
      </svg>
      <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v0.01M12 11v5" stroke-linecap="round" />
      </svg>
    </span>

    <p class="toast__message">{{ toast.message }}</p>

    <button class="toast__close" type="button" (click)="toastService.dismiss(toast.id)">×</button>
  </div>
</div>
